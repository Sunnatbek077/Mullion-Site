<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mullion Changelog — Release Notes and Version History</title>
<meta name="description" content="Every Mullion release: new features, fixes and version history for the Mac app that runs Windows games.">
<link rel="canonical" href="https://mullion-runtime.vercel.app/whats-new.html">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/subpage.css">
<style>
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:170px 1fr;gap:8px 32px;padding:28px 0;border-top:1px solid var(--line-d)}
.meta{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ver{font-size:22px;font-weight:700;letter-spacing:-.02em}
.date{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.05em;color:var(--w-3)}
.latest{padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--cold);background:rgb(111 168 220 /.13)}
.notes{margin:0;color:var(--w-2);font-size:16px;line-height:1.65;white-space:pre-line}
.notes.none{color:var(--w-3);font-style:italic}
.dl{display:inline-block;margin-top:14px;font-size:14.5px;font-weight:500}
.state{color:var(--w-3);padding:28px 0;border-top:1px solid var(--line-d)}
@media(max-width:620px){.item{grid-template-columns:1fr;gap:10px}.meta{flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px}}
</style>

</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="./"><img src="img/favicon.svg" alt="">Mullion</a>
  <a class="back" href="./#specs">‹ Download</a>
</div></header>

<main>
  <p class="kick">Mullion for Mac</p>
  <h1>What’s new</h1>
  <p class="lede">Every published version of Mullion, newest first.</p>
  <ol class="list" id="list"><li class="state" id="state">Loading…</li></ol>
</main>

<script>
(function(){
  var UPDATE_API_URL = 'https://api.github.com/repos/Sunnatbek077/mullion-runtime/contents/update.json?ref=main';
  var UPDATE_RAW_URL = 'https://raw.githubusercontent.com/Sunnatbek077/mullion-runtime/main/update.json';
  var list = document.getElementById('list');

  function getJSON(url, headers){
    return fetch(url, {cache:'no-store', headers: headers || {}})
      .then(function(r){ if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); });
  }
  function fetchUpdateDoc(){
    return getJSON(UPDATE_API_URL, {Accept:'application/vnd.github.raw+json'})
      .catch(function(){ return getJSON(UPDATE_RAW_URL); });
  }
  // same rule as the main page and the admin app's VersionOrder
  function compareVersions(a, b){
    var x = String(a).split('.'), y = String(b).split('.');
    for (var i = 0; i < Math.max(x.length, y.length); i++){
      var d = (parseInt(x[i], 10) || 0) - (parseInt(y[i], 10) || 0);
      if (d) return d;
    }
    return 0;
  }
  function formatDate(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
  }
  function entries(doc){
    var all = [];
    if (doc && Array.isArray(doc.history)) all = all.concat(doc.history);
    if (doc && doc.latest) all.push(doc.latest);
    var seen = {};
    return all.filter(function(r){
      if (!r || !r.version) return false;
      var k = r.version + '|' + (r.build || '');
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    }).sort(function(x, y){
      return compareVersions(y.version, x.version) || compareVersions(y.build || 0, x.build || 0);
    });
  }
  function show(msg){
    list.textContent = '';
    var li = document.createElement('li');
    li.className = 'state';
    li.textContent = msg;
    list.appendChild(li);
  }

  fetchUpdateDoc().then(function(doc){
    var rows = entries(doc);
    if (!rows.length){ show('No version has been published yet.'); return; }
    var liveV = doc.latest && doc.latest.version, liveB = doc.latest && doc.latest.build;
    list.textContent = '';
    rows.forEach(function(r){
      var li = document.createElement('li'); li.className = 'item';
      var meta = document.createElement('div'); meta.className = 'meta';
      var v = document.createElement('span'); v.className = 'ver'; v.textContent = r.version;
      meta.appendChild(v);
      if (r.version === liveV && (r.build || '') === (liveB || '')){
        var t = document.createElement('span'); t.className = 'latest'; t.textContent = 'Latest';
        meta.appendChild(t);
      }
      var when = r.publishedAt ? formatDate(r.publishedAt) : null;
      if (when){ var d = document.createElement('span'); d.className = 'date'; d.textContent = when; meta.appendChild(d); }
      var body = document.createElement('div');
      var n = document.createElement('p'); n.className = 'notes';
      var text = r.notes && String(r.notes).trim();
      if (text) n.textContent = text; else { n.className += ' none'; n.textContent = 'No release notes were published for this version.'; }
      body.appendChild(n);
      li.appendChild(meta); li.appendChild(body);
      list.appendChild(li);
    });
  }).catch(function(){ show('Couldn’t load the version history. Try again in a minute.'); });
})();
</script>
</body>
</html>
